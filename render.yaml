services:
  - type: web
    name: radarjud-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
      - key: CNJ_PROXY_URL
        sync: false
      - key: DATAJUD_API_KEY
        sync: false
      - key: PORTAL_TRANSPARENCIA_API_KEY
        sync: false

