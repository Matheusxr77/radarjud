name: CI - Regular Checks

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Code Quality & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Check Python syntax and critical errors (Ruff)
        # Ruff checks syntax errors unconditionally; F63, F7, F82 catch undefined names & broken syntax constructs
        run: |
          if [ -n "$(find . -name '*.py' -not -path './.*' -print -quit)" ]; then
            ruff check . --select=F63,F7,F82 --output-format=github
          else
            echo "No Python files found yet, skipping Ruff critical check."
          fi

      - name: General style & lint warnings (non-blocking)
        run: |
          if [ -n "$(find . -name '*.py' -not -path './.*' -print -quit)" ]; then
            ruff check . --exit-zero --output-format=github
          else
            echo "No Python files found yet, skipping Ruff style check."
          fi

      - name: Compile Python files
        run: |
          if [ -d "app" ]; then
            python -m compileall -q app
          fi
          if [ -f "run.py" ]; then
            python -m py_compile run.py
          fi

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        if: hashFiles('requirements.txt') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Set up environment variables
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Run pytest
        run: |
          if [ -d "tests" ]; then
            set +e
            PYTHONPATH=. pytest tests/ -v --tb=short
            exit_code=$?
            set -e
            if [ $exit_code -eq 5 ]; then
              echo "No tests collected yet (pytest exit code 5) — passing check."
              exit 0
            fi
            exit $exit_code
          else
            echo "No tests directory found yet, skipping pytest."
          fi

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment file for Docker Compose
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Validate docker-compose.yml
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose config -q

      - name: Test Docker image build
        if: hashFiles('Dockerfile') != ''
        run: docker build -t radarjud:ci-test .

